<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Carte HDI interactive</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
        }

        #map {
            height: 600px;
        }

        #year-slider-container {
            z-index: 1000;
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 75%;
            background: white;
            padding: 10px;
            border-radius: 10px;
            text-align: center;
            box-shadow: 0 0 10px rgba(0,0,0,0.2);
            font-family: Arial, sans-serif;
        }

        #year-slider {
            width: 100%;
        }

        #selected-year {
            font-weight: bold;
        }

        #continent-selector-container {
          position: absolute;
          top: 20px;
          right: 20px;
          background: white;
          padding: 10px;
          border-radius: 8px;
          box-shadow: 0 0 10px rgba(0,0,0,0.2);
          z-index: 1000;
          font-family: Arial, sans-serif;
        }

        :fullscreen {
            background: white;
        }

        #map-card-container:fullscreen {
            display: flex;
            flex-direction: column;
            justify-content: stretch;
            align-items: stretch;
            background: white;
            width: 100%;
            height: 100%;
        }

        #map-card-container:fullscreen #map {
            flex: 1;
            height: 100%;
        }

        
        .legend {
            padding: 8px;
            background: white;
            border-radius: 5px;
            box-shadow: 0 0 10px rgba(0,0,0,0.2);
            line-height: 20px;
            font-family: Arial, sans-serif;
            font-size: 12px;
            color: #555;
        }

        .legend i {
            border-radius: 3px;
        }
    </style>
</head>
<body>
    <!-- <div id="continent-selector-container">
        <label for="continent-selector">Afficher les pays de : </label>
        <select id="continent-selector">
          <option value="world">Monde entier</option>
          <option value="Africa">Afrique</option>
          <option value="Asia">Asie</option>
          <option value="Europe">Europe</option>
          <option value="North America">Amérique du Nord</option>
          <option value="South America">Amérique du Sud</option>
          <option value="Oceania">Océanie</option>
        </select>
    </div> -->
    
    <div id="map-card-container" style="
  position: relative;
  width: 90%;
  margin: 30px auto;
  border-radius: 12px;
  box-shadow: 0 0 20px rgba(0,0,0,0.2);
  overflow: hidden;
  font-family: Arial, sans-serif;
">
  <div id="map" style="height: 600px;"></div>

  <!-- Filtre continent -->
  <div style="padding: 10px; display: flex; justify-content: center;">
    <label for="continent-selector" style="margin-right: 8px;">Afficher les pays de :</label>
    <select id="continent-selector">
      <option value="world">Monde entier</option>
      <option value="Africa">Afrique</option>
      <option value="Asia">Asie</option>
      <option value="Europe">Europe</option>
      <option value="North America">Amérique du Nord</option>
      <option value="South America">Amérique du Sud</option>
      <option value="Oceania">Océanie</option>
    </select>
  </div>

  <!-- Slider année -->
    <div style="text-align: center; margin-bottom: 10px;">
        <label for="mode-selector">Afficher selon :</label>
        <select id="mode-selector">
        <option value="hdi">Indice de développement humain (HDI)</option>
        <option value="mental">Troubles mentaux (dépression + anxiété)</option>
        </select>
    </div>
  
    <div style="padding: 10px;">
        <div style="text-align: center;">
          Année sélectionnée : <span id="selected-year"></span><br>
          <input type="range" id="year-slider" min="1990" max="2023" step="1" value="2023" style="width: 80%;">
          <button id="play-button" style="
            margin-left: 10px;
            background: #28a745;
            color: white;
            border: none;
            padding: 5px 12px;
            border-radius: 6px;
            cursor: pointer;
          ">▶️ Lecture</button>
        </div>
      
        <!-- Icône plein écran alignée à droite -->
        <div style="text-align: right; margin-top: 10px;">
            <!-- Bouton Export -->
          <button id="export-button" style="
          background: none;
          border: none;
          margin-right: 10px;
          cursor: pointer;
        ">
          <img src="download.png" alt="Exporter la carte" style="width: 24px; height: 24px;">
        </button>

          <button id="fullscreen-toggle" style="
            background: none;
            border: none;
            cursor: pointer;
          ">
            <img src="fullscreen.png" alt="Plein écran" style="width: 24px; height: 24px;">
          </button>
        </div>
  


    <!-- <div id="year-slider-container">
        Année sélectionnée : <span id="selected-year"></span><br>
        <input type="range" id="year-slider" min="1990" max="2023" step="1" value="2023">
        <button id="play-button">▶️ Lecture</button>
      </div>       -->

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="countryToContinent.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
