<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Carte HDI interactive</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f4f4;
        }

        nav {
            background: #222;
            color: white;
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-right: 20px;
            font-weight: 500;
        }

        nav a:hover {
            text-decoration: underline;
        }

        #map {
            height: 600px;
        }

        #map-card-container {
            position: relative;
            width: 95%;
            margin: 30px auto;
            border-radius: 12px;
            box-shadow: 0 0 20px rgba(0,0,0,0.1);
            overflow: hidden;
            background: white;
        }

        #continent-selector-container,
        #mental-toggle-container,
        #year-slider-container {
            padding: 15px;
        }

        #mental-toggle-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 12px;
        }

        #mental-toggle-container label {
            background: #f0f0f0;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s ease-in-out;
        }

        #mental-toggle-container label:hover {
            background: #ddd;
        }

        #year-slider-container {
            text-align: center;
        }

        #play-button {
            margin-left: 10px;
            background: #28a745;
            color: white;
            border: none;
            padding: 6px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }

        #play-button:hover {
            background: #218838;
        }

        #selected-year {
            font-weight: bold;
            color: #333;
        }

        .legend {
            padding: 8px;
            background: white;
            border-radius: 5px;
            box-shadow: 0 0 10px rgba(0,0,0,0.2);
            line-height: 20px;
            font-size: 13px;
            color: #555;
        }

        .legend i {
            border-radius: 3px;
        }

        .controls-container {
            padding: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        #fullscreen-toggle img {
            width: 28px;
            height: 28px;
            transition: transform 0.2s;
        }

        #fullscreen-toggle:hover img {
            transform: scale(1.1);
        }
    </style>
</head>
<body>
<nav>
    <div><strong>Santé mentale & HDI</strong></div>
    <div>
        <a href="index.html">Carte interactive</a>
        <a href="resultats.html">Résultats observés</a>
    </div>
</nav>

<div id="map-card-container">
    <div id="map"></div>

    <div class="controls-container">
        <label for="continent-selector">Afficher les pays de :</label>
        <select id="continent-selector">
            <option value="world">Monde entier</option>
            <option value="Africa">Afrique</option>
            <option value="Asia">Asie</option>
            <option value="Europe">Europe</option>
            <option value="North America">Amérique du Nord</option>
            <option value="South America">Amérique du Sud</option>
            <option value="Oceania">Océanie</option>
        </select>
    </div>

    <div id="mental-toggle-container">
        <label><input type="checkbox" class="mental-toggle" value="depression" checked> Dépression</label>
        <label><input type="checkbox" class="mental-toggle" value="anxiety" checked> Anxiété</label>
        <label><input type="checkbox" class="mental-toggle" value="bipolar" checked> Bipolarité</label>
        <label><input type="checkbox" class="mental-toggle" value="schizophrenia" checked> Schizophrénie</label>
        <label><input type="checkbox" class="mental-toggle" value="eating" checked> Troubles alimentaires</label>
    </div>

    <div id="year-slider-container">
        Année sélectionnée : <span id="selected-year"></span><br>
        <input type="range" id="year-slider" min="1990" max="2019" step="1" value="2019" style="width: 80%;">
        <button id="play-button">▶️ Lecture</button>
    </div>

    <div style="text-align: right; margin-top: 10px; padding: 10px;">
        <button id="fullscreen-toggle" style="background: none; border: none; cursor: pointer;">
            <img src="fullscreen.png" alt="Plein écran">
        </button>
    </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="countryToContinent.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="script.js"></script>
</body>
</html>
